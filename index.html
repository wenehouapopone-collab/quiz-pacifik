<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pacifik 🇳🇨</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#00a896,#05668d);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
color:#123;
}

.card{
width:100%;
max-width:520px;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 15px 45px #0005;
text-align:center;
}

.logo{
font-size:55px;
}

h1{
margin:5px 0 8px;
font-size:34px;
}

.sub{
color:#666;
margin-bottom:22px;
}

button{
width:100%;
border:0;
border-radius:14px;
padding:15px;
margin:7px 0;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#e9f5f3;
color:#064f4a;
}

button:hover{
transform:translateY(-1px);
}

.primary{
background:#00a896;
color:white;
}

.progress{
height:10px;
background:#eee;
border-radius:10px;
overflow:hidden;
margin:15px 0 20px;
}

.bar{
height:100%;
background:#00a896;
width:0%;
transition:.3s;
}

.score{
font-size:20px;
font-weight:bold;
margin:15px;
}

.level{
font-size:15px;
font-weight:bold;
color:#05668d;
margin-bottom:8px;
}

.good{
background:#bdf5cc!important;
}

.bad{
background:#ffc5c5!important;
}

.hidden{
display:none;
}

.small{
font-size:13px;
color:#777;
margin-top:18px;
}

.resultScore{
font-size:30px;
font-weight:bold;
margin:15px;
}
</style>
</head>

<body>

<div class="card">

<section id="home">

<div class="logo">🌴🇳🇨</div>

<h1>Quiz Pacifik</h1>

<div class="sub">
Teste tes connaissances sur la Nouvelle-Calédonie !
</div>

<button class="primary" onclick="startGame()">
🎮 Jouer
</button>

<div class="small">
30 questions • 3 niveaux • Gratuit
</div>

</section>


<section id="game" class="hidden">

<div class="level" id="level"></div>

<div id="counter"></div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<h2 id="question"></h2>

<div id="answers"></div>

<div class="score">
⭐ <span id="score">0</span> points
</div>

</section>


<section id="result" class="hidden">

<div class="logo">🏆</div>

<h1>Bravo !</h1>

<div class="resultScore">
<span id="finalScore"></span>
</div>

<p id="message"></p>

<button class="primary" onclick="startGame()">
🔄 Rejouer
</button>

<button onclick="showHome()">
🏠 Accueil
</button>

</section>

</div>
