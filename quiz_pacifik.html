<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pacifik 🇳🇨</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#00a896,#05668d);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;color:#123}
.card{width:100%;max-width:520px;background:white;border-radius:24px;padding:28px;box-shadow:0 15px 45px #0004;text-align:center}
h1{margin:0 0 8px;font-size:34px}.sub{color:#666;margin-bottom:24px}
button{width:100%;border:0;border-radius:14px;padding:15px;margin:8px 0;font-size:17px;font-weight:bold;cursor:pointer;background:#e9f5f3;color:#064f4a}
button:hover{transform:translateY(-1px)}.primary{background:#00a896;color:white}.score{font-size:22px;font-weight:bold;margin:18px}
.progress{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin:15px 0 25px}.bar{height:100%;background:#00a896;width:0}
.hidden{display:none}.good{background:#c8f7d5!important}.bad{background:#ffd0d0!important}
.small{font-size:13px;color:#777;margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <section id="home">
    <div style="font-size:55px">🌴🇳🇨</div>
    <h1>Quiz Pacifik</h1>
    <div class="sub">Teste tes connaissances sur la Nouvelle-Calédonie !</div>
    <button class="primary" onclick="startGame()">🎮 Jouer</button>
    <div class="small">Prototype gratuit — 10 questions</div>
  </section>

  <section id="game" class="hidden">
    <div id="counter"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <div class="score">⭐ <span id="score">0</span> points</div>
  </section>

  <section id="result" class="hidden">
    <div style="font-size:55px">🏆</div>
    <h1>Bravo !</h1>
    <p id="final"></p>
    <button class="primary" onclick="startGame()">🔄 Rejouer</button>
    <button onclick="showHome()">🏠 Accueil</button>
  </section>
</div>

<script>
const questions=[
 {q:"Quelle est la capitale de la Nouvelle-Calédonie ?",a:["Koné","Nouméa","Bourail","Lifou"],c:1},
 {q:"Quel océan entoure la Nouvelle-Calédonie ?",a:["Atlantique","Indien","Pacifique","Arctique"],c:2},
 {q:"Quelle est la grande île principale de la Nouvelle-Calédonie ?",a:["Grande Terre","Maré","Ouvéa","Lifou"],c:0},
 {q:"Le lagon calédonien est notamment connu pour ses…",a:["Récifs coralliens","Glaciers","Volcans actifs","Fjords"],c:0},
 {q:"Quelle ville se trouve sur la côte ouest de Grande Terre ?",a:["Poindimié","Hienghène","Koné","Thio"],c:2},
 {q:"Quel animal marin peut-on observer dans les eaux calédoniennes ?",a:["Baleine à bosse","Ours polaire","Phoque arctique","Morse"],c:0},
 {q:"Quelle île fait partie des Îles Loyauté ?",a:["Lifou","Tahiti","Bora Bora","Wallis"],c:0},
 {q:"Quel fruit tropical est souvent associé aux régions du Pacifique ?",a:["Pomme","Mangue","Canneberge","Pêche"],c:1},
 {q:"Quel est le nom du principal aéroport international de Grande Terre ?",a:["La Tontouta","Magenta Nord","Mouméa","Koumac Centre"],c:0},
 {q:"Combien de questions contient cette première partie ?",a:["5","10","15","20"],c:1}
];
let i=0,score=0,locked=false;
function startGame(){i=0;score=0;locked=false;document.getElementById("home").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("game").classList.remove("hidden");showQuestion()}
function showQuestion(){
 locked=false;let x=questions[i];document.getElementById("counter").textContent=`Question ${i+1} / ${questions.length}`;
 document.getElementById("bar").style.width=((i)/questions.length*100)+"%";
 document.getElementById("question").textContent=x.q;document.getElementById("score").textContent=score;
 const box=document.getElementById("answers");box.innerHTML="";
 x.a.forEach((ans,n)=>{let b=document.createElement("button");b.textContent=ans;b.onclick=()=>answer(n,b);box.appendChild(b)})
}
function answer(n,b){
 if(locked)return;locked=true;let x=questions[i];
 if(n===x.c){score+=10;b.classList.add("good")}else{b.classList.add("bad")}
 document.getElementById("score").textContent=score;
 setTimeout(()=>{i++;if(i<questions.length)showQuestion();else finish()},650)
}
function finish(){
 document.getElementById("game").classList.add("hidden");document.getElementById("result").classList.remove("hidden");
 document.getElementById("final").innerHTML=`Tu as obtenu <strong>${score} / 100</strong> points.<br>${score>=80?"🔥 Excellent !":score>=50?"👏 Bien joué !":"💪 Retente ta chance !"}`
}
function showHome(){document.getElementById("result").classList.add("hidden");document.getElementById("home").classList.remove("hidden")}
</script>
</body>
</html>
